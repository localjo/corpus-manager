services:
  corpus-manager-mcp:
    build: .
    container_name: corpus-manager-mcp
    env_file:
      - .env
    volumes:
      - ${HOST_VAULT_PATH:-./vault}:/data/vault
    ports:
      - "${PORT:-8765}:8765"
    depends_on:
      - markdown-vault-mcp
    restart: unless-stopped

  markdown-vault-mcp:
    image: ghcr.io/pvliesdonk/markdown-vault-mcp:latest
    container_name: markdown-vault-mcp
    command: ["markdown-vault-mcp", "serve", "--transport", "http", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MARKDOWN_VAULT_MCP_SOURCE_DIR: /data/vault
    volumes:
      - ${HOST_VAULT_PATH:-./vault}:/data/vault
      - markdown-vault-state:/data/state
    expose:
      - "8000"
    restart: unless-stopped

  syncthing:
    image: syncthing/syncthing:latest
    container_name: corpus-syncthing
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - ${HOST_VAULT_PATH:-./vault}:/var/syncthing/Vault
      - ${HOST_SYNCTHING_CONFIG_PATH:-./syncthing-config}:/var/syncthing/config
    restart: unless-stopped

volumes:
  markdown-vault-state:
