services:
  corpus-manager-mcp:
    build: .
    container_name: corpus-manager-mcp
    env_file:
      - .env
    volumes:
      - ${HOST_VAULT_PATH:-./vault}:/data/vault
      - ${HOST_VAULTS_PATH:-./vaults}:/data/vaults
      - ${HOST_CORPUS_REGISTRY_PATH:-./corpus-registry.yaml}:/data/corpus-registry.yaml
    ports:
      - "${PORT:-8765}:8765"
    restart: unless-stopped

  syncthing:
    image: syncthing/syncthing:latest
    container_name: corpus-syncthing
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - ${HOST_VAULT_PATH:-./vault}:/var/syncthing/Vault
      - ${HOST_VAULTS_PATH:-./vaults}:/var/syncthing/Vaults
      - ${HOST_SYNCTHING_CONFIG_PATH:-./syncthing-config}:/var/syncthing/config
    restart: unless-stopped
